<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSE Safety System | Sathosa Motors</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }
    .card-grid {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2rem;
      width: 250px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border-color: var(--primary);
    }
    .card-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🛡️</div>
    <h1>HSE Safety System</h1>
    <p class="subtitle">Sathosa Motors Inspection Portal</p>
    
    <div class="card-grid">
      <a href="ladder.html" class="card">
        <div class="card-icon">🪜</div>
        <div class="card-title">Ladder Inspection</div>
        <div class="card-desc">Record step and extension ladder inspections</div>
      </a>
      
      <a href="fire.html" class="card">
        <div class="card-icon">🧯</div>
        <div class="card-title">Fire Extinguisher</div>
        <div class="card-desc">Record fire extinguisher monthly checks</div>
      </a>

      <a href="firstaid.html" class="card">
        <div class="card-icon">🩹</div>
        <div class="card-title">First Aid Box</div>
        <div class="card-desc">Monthly first aid kit/box item checklist</div>
      </a>
    </div>
  </div>
</body>
</html>
