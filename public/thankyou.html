<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Safety Inspection</title>
  <style>
    :root {
      --c-bg: #101214;
      --c-surface: #1A1D21;
      --c-surface-2: #22252A;
      --c-border: #2C3035;
      --c-text: #E5E7EB;
      --c-text-2: #9CA3AF;
      --c-accent: #F0A500;
      --c-accent-hover: #D48C00;
      --r-md: 12px;
    }
    
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--c-bg);
      color: var(--c-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    .thank-you-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-md);
      padding: 60px 40px;
      width: min(580px, 100%);
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      background: rgba(240, 165, 0, 0.1);
      border: 2px solid var(--c-accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--c-text-2);
      line-height: 1.6;
      margin: 0 0 40px 0;
      font-size: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--c-accent);
      color: #000;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--c-accent-hover);
      transform: translateY(-2px);
    }

    @media (max-width: 430px) {
      .thank-you-card {
        padding: 40px 20px;
      }
      .icon-wrapper {
        margin-bottom: 24px;
      }
      p {
        margin-bottom: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="thank-you-card">
    <div class="icon-wrapper">🛡️</div>
    <h1>Thank You!</h1>
    <p>Your safety inspection has been successfully submitted and recorded. Maintaining a safe workplace is our top priority.</p>
    <a href="/" class="btn">
      <span>Return to Dashboard</span>
      <span>→</span>
    </a>
  </div>
</body>
</html>
